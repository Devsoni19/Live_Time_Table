<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Timetable Editor</title>

  <!--stylesheets-->

  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/admin_editor.css">

  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="editor-page">

    <!-- ========================= -->
    <!-- Header -->
    <!-- ========================= -->

    <header class="glass editor-header">
      <!-- Header Left -->
      <div class="logo-area">
        <img src="References/logo.png" alt="VGEC Logo" class="logo-img">
        <div class="heading">
          <h1>Timetable Editor</h1>
          <p class="subtitle">VGEC ICT Semester 5 • O4 Batch</p>
        </div>
      </div>
      <!-- Header Right -->
      <div class="editor-header-buttons">

        <button id="btnBack" class="glass-btn">

          Back

        </button>

        <button id="btnAddLecture" class="glass-btn primary-btn">

          <i class="fa-solid fa-square-plus"></i> Add Lecture

        </button>

      </div>

    </header>



    <!-- ========================= -->
    <!-- Search -->
    <!-- ========================= -->

    <section class="glass editor-toolbar">

      <div class="editor-search-box">

        <span class="search-icon">🔍</span>

        <input type="text" id="searchLecture" placeholder="Search subject, faculty or lecture type...">

      </div>

    </section>



    <!-- ========================= -->
    <!-- Day Tabs -->
    <!-- ========================= -->

    <section class="day-tabs">

      <button class="day-tab active" data-day="Monday">
        Monday
      </button>

      <button class="day-tab" data-day="Tuesday">
        Tuesday
      </button>

      <button class="day-tab" data-day="Wednesday">
        Wednesday
      </button>

      <button class="day-tab" data-day="Thursday">
        Thursday
      </button>

      <button class="day-tab" data-day="Friday">
        Friday
      </button>

    </section>



    <!-- ========================= -->
    <!-- Table -->
    <!-- ========================= -->

    <section class="glass editor-card">

      <div class="editor-table-wrapper">


        <table class="editor-table">

          <caption class="sr-only">
            Timetable lectures
          </caption>

          <thead>

            <tr>

              <th>#</th>

              <th>Subject</th>

              <th>Faculty</th>

              <th>Time</th>

              <th>Type</th>

              <th>Actions</th>

            </tr>

          </thead>

          <tbody id="lectureTableBody">

            <!-- JS -->

          </tbody>

        </table>

      </div>

    </section>

  </div>



  <!-- ========================= -->
  <!-- Modal -->
  <!-- ========================= -->

  <div id="lectureModal" class="editor-modal hidden">

    <div class="glass modal-box">

      <h2 id="modalTitle"></h2>



      <div class="form-group">

        <label>

          Subject

        </label>

        <select id="subject" required>
          <option value="">
            Select Subject
          </option>
        </select>

      </div>



      <div class="form-group">

        <label for="faculty">Faculty</label>

        <select id="faculty" required>
          <option value="">Loading faculty...</option>
        </select>

      </div>



      <div class="row">

        <div class="form-group">

          <label for="start">Start</label>


          <input id="start" type="time">

        </div>

        <div class="form-group">

          <label for="end">End</label>


          <input id="end" type="time" required>

        </div>

      </div>



      <div class="form-group">

        <label for="type">Type</label>

        <select id="type" required>

          <option value="Lecture">Lecture</option>

          <option value="Lab">Lab</option>

        </select>

      </div>



      <div class="modal-buttons">

        <button id="btnSave" class="glass-btn primary-btn">

          💾 Save

        </button>

        <button id="btnDelete" class="glass-btn danger-btn">

          🗑 Delete

        </button>

        <button id="btnCancel" class="glass-btn">

          Cancel

        </button>

      </div>

    </div>

  </div>



  <script type="module" src="JS/timetable-editor.js"></script>

</body>

</html>
